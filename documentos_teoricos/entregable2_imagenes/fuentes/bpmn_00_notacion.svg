<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="900" viewBox="0 0 1500 900" font-family="Arial, Helvetica, sans-serif"><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#404040"/></marker><marker id="flecha_azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="flecha_verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7b4f"/></marker><marker id="flecha_roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c00000"/></marker><marker id="flecha_gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f7f7f"/></marker><marker id="abierta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#404040" stroke-width="1.4"/></marker><marker id="triangulo" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#404040" stroke-width="1.2"/></marker><marker id="rombo" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#404040"/></marker><marker id="rombo_hueco" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#fff" stroke="#404040"/></marker><marker id="circulo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#fff" stroke="#404040" stroke-width="1.2"/></marker></defs><rect x="0" y="0" width="1500" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="30" y="42" font-size="20" fill="#1f4e79" font-weight="bold" text-anchor="start">Notación BPMN 2.0 utilizada en los diagramas de Facturas S20</text><rect x="30" y="70" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="46" y="198" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Evento de inicio</text><text x="46" y="218" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Dispara el proceso. Con sobre: lo inicia un</text><text x="46" y="233" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">mensaje (llega el pedido).</text><circle cx="165.0" cy="130" r="17" fill="#fff" stroke="#1e7b4f" stroke-width="2"/><circle cx="255.0" cy="130" r="17" fill="#fff" stroke="#1e7b4f" stroke-width="2"/><rect x="247.0" y="124.5" width="16" height="11" rx="0" fill="#fff" stroke="#1e7b4f" stroke-width="1.3"/><path d="M247.0,124.5 L255.0,131 L263.0,124.5" fill="none" stroke="#1e7b4f" stroke-width="1.2"/><rect x="395" y="70" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="411" y="198" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Evento intermedio de temporizador</text><text x="411" y="218" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Espera una fecha o un plazo: fin de mes, días</text><text x="411" y="233" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">antes del vencimiento.</text><circle cx="530.0" cy="130" r="17" fill="#fff" stroke="#c55a11" stroke-width="1.6"/><circle cx="530.0" cy="130" r="13" fill="#fff" stroke="#c55a11" stroke-width="1.2"/><circle cx="530.0" cy="130" r="8" fill="#fff" stroke="#c55a11" stroke-width="1.3"/><line x1="530.0" y1="130" x2="530.0" y2="124" stroke="#c55a11" stroke-width="1.3"/><line x1="530.0" y1="130" x2="534.0" y2="132" stroke="#c55a11" stroke-width="1.3"/><circle cx="620.0" cy="130" r="17" fill="#fff" stroke="#c55a11" stroke-width="1.6"/><circle cx="620.0" cy="130" r="13" fill="#fff" stroke="#c55a11" stroke-width="1.2"/><rect x="612.0" y="124.5" width="16" height="11" rx="0" fill="#c55a11" stroke="#c55a11" stroke-width="1.3"/><path d="M612.0,124.5 L620.0,131 L628.0,124.5" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="760" y="70" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="776" y="198" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Evento de fin</text><text x="776" y="218" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Termina el recorrido del proceso. Borde grueso;</text><text x="776" y="233" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">puede indicar un resultado.</text><circle cx="940.0" cy="130" r="17" fill="#fff" stroke="#c00000" stroke-width="4"/><rect x="1125" y="70" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="1141" y="198" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Tarea</text><text x="1141" y="218" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Trabajo atómico. El ícono indica el tipo: de</text><text x="1141" y="233" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">usuario, de servicio, de regla de negocio o</text><text x="1141" y="248" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">manual.</text><rect x="1155.0" y="98.0" width="140" height="56" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="1.8"/><circle cx="1169.0" cy="110.0" r="3.6" fill="#fff" stroke="#404040" stroke-width="1.1"/><path d="M1163.0,120.0 Q1169.0,111.0 1175.0,120.0 Z" fill="#fff" stroke="#404040" stroke-width="1.1"/><text x="1225.0" y="134.0" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">Tarea de usuario</text><rect x="1315.0" y="98.0" width="140" height="56" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="1.8"/><circle cx="1329.0" cy="112.0" r="5.5" fill="#fff" stroke="#404040" stroke-width="1.2" stroke-dasharray="2.2 1.6"/><circle cx="1329.0" cy="112.0" r="2.2" fill="#fff" stroke="#404040" stroke-width="1.1"/><text x="1385.0" y="134.0" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">Tarea de servicio</text><rect x="30" y="270" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="46" y="398" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Tarea de regla de negocio</text><text x="46" y="418" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">La ejecuta el motor de reglas del NRUS (categoría,</text><text x="46" y="433" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">cuota, topes, vencimiento).</text><rect x="60.0" y="298.0" width="140" height="56" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="1.8"/><rect x="68.0" y="306.0" width="14" height="11" rx="0" fill="#fff" stroke="#404040" stroke-width="1"/><rect x="68.0" y="306.0" width="14" height="3.5" rx="0" fill="#f2f2f2" stroke="#404040" stroke-width="1"/><line x1="68.0" y1="313.2" x2="82.0" y2="313.2" stroke="#404040" stroke-width="0.8"/><line x1="72.5" y1="309.5" x2="72.5" y2="317.0" stroke="#404040" stroke-width="0.8"/><text x="130.0" y="326.5" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">Calcular</text><text x="130.0" y="341.5" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">categoría</text><rect x="220.0" y="298.0" width="140" height="56" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="1.8"/><path d="M228.0,311.0 h8 a2,2 0 0 1 0,4 h-2 M228.0,311.0 v6 h9" fill="none" stroke="#404040" stroke-width="1.1"/><text x="290.0" y="334.0" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">Declarar en SUNAT</text><rect x="395" y="270" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="411" y="398" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Subproceso colapsado</text><text x="411" y="418" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Agrupa actividades que se detallan en otro</text><text x="411" y="433" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">diagrama (marca [+]).</text><rect x="490.0" y="296.0" width="170" height="60" rx="10" fill="#fff" stroke="#1f4e79" stroke-width="1.8"/><text x="575.0" y="316.5" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">Registrar factura con</text><text x="575.0" y="331.5" font-size="12.5" fill="#1a1a1a" font-weight="normal" text-anchor="middle">IA</text><rect x="568.0" y="341.0" width="14" height="12" rx="0" fill="#fff" stroke="#404040" stroke-width="1"/><line x1="571.0" y1="347.0" x2="579.0" y2="347.0" stroke="#404040" stroke-width="1.2"/><line x1="575.0" y1="343.0" x2="575.0" y2="351.0" stroke="#404040" stroke-width="1.2"/><rect x="760" y="270" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="776" y="398" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Compuerta exclusiva (XOR)</text><text x="776" y="418" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Solo una salida según la condición: ¿la foto es</text><text x="776" y="433" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">legible?</text><polygon points="940.0,310 964.0,334 940.0,358 916.0,334" fill="#fffbe6" stroke="#c55a11" stroke-width="1.8"/><line x1="932.0" y1="326" x2="948.0" y2="342" stroke="#404040" stroke-width="2.6"/><line x1="948.0" y1="326" x2="932.0" y2="342" stroke="#404040" stroke-width="2.6"/><rect x="1125" y="270" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="1141" y="398" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Compuerta paralela (AND)</text><text x="1141" y="418" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Abre o sincroniza caminos que ocurren a la vez.</text><polygon points="1305.0,310 1329.0,334 1305.0,358 1281.0,334" fill="#fffbe6" stroke="#c55a11" stroke-width="1.8"/><line x1="1295.0" y1="334" x2="1315.0" y2="334" stroke="#404040" stroke-width="2.6"/><line x1="1305.0" y1="324" x2="1305.0" y2="344" stroke="#404040" stroke-width="2.6"/><rect x="30" y="470" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="46" y="598" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Flujo de secuencia</text><text x="46" y="618" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Orden de ejecución dentro de un mismo pool. Puede</text><text x="46" y="633" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">llevar condición.</text><path d="M100.0,530 L320.0,530" fill="none" stroke="#404040" stroke-width="1.6" marker-end="url(#flecha)"/><text x="210.0" y="522" font-size="11" fill="#404040" font-weight="normal" font-style="italic" text-anchor="middle">sí</text><rect x="395" y="470" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="411" y="598" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Flujo de mensaje</text><text x="411" y="618" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Comunicación entre participantes distintos (bodega</text><text x="411" y="633" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">↔ SUNAT).</text><path d="M465.0,530 L685.0,530" fill="none" stroke="#404040" stroke-width="1.3" stroke-dasharray="7 5" marker-end="url(#abierta)" marker-start="url(#circulo)"/><rect x="760" y="470" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="776" y="598" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Objeto de datos</text><text x="776" y="618" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Información que una tarea usa o produce (factura,</text><text x="776" y="633" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">reporte PDF).</text><path d="M922.0,492 h26 l10,10 v36 h-36 z" fill="#fff" stroke="#404040" stroke-width="1.3"/><path d="M948.0,492 v10 h10" fill="none" stroke="#404040" stroke-width="1.1"/><rect x="1125" y="470" width="360" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><text x="1141" y="598" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Almacén de datos</text><text x="1141" y="618" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Información persistente: base local cifrada,</text><text x="1141" y="633" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">servidor de respaldo.</text><path d="M1277.0,503 a28.0,7 0 0 0 56,0 v30 a28.0,7 0 0 1 -56,0 z" fill="#fff" stroke="#404040" stroke-width="1.3"/><ellipse cx="1305.0" cy="503" rx="28.0" ry="7" fill="#fff" stroke="#404040" stroke-width="1.3"/><rect x="30" y="670" width="725" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><rect x="50" y="686" width="330" height="120" rx="0" fill="#fff" stroke="#404040" stroke-width="1.6"/><rect x="50" y="686" width="34" height="120" rx="0" fill="#dce6f2" stroke="#404040" stroke-width="1.6"/><text x="67.0" y="746.0" font-size="14" fill="#404040" font-weight="bold" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 67.0 746.0)">Bodega</text><rect x="84" y="686" width="30" height="60" rx="0" fill="#f2f2f2" stroke="#404040" stroke-width="1"/><text x="99.0" y="716.0" font-size="12" fill="#404040" font-weight="normal" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 99.0 716.0)">Titular</text><rect x="84" y="746" width="30" height="60" rx="0" fill="#f2f2f2" stroke="#404040" stroke-width="1"/><text x="99.0" y="776.0" font-size="12" fill="#404040" font-weight="normal" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 99.0 776.0)">App</text><line x1="84" y1="746" x2="380" y2="746" stroke="#404040" stroke-width="1"/><text x="410" y="710" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Pool y carriles</text><text x="410" y="732" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">El pool representa a un participante (la</text><text x="410" y="747" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">bodega, el distribuidor, la SUNAT). Los</text><text x="410" y="762" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">carriles separan quién ejecuta cada tarea</text><text x="410" y="777" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">dentro del participante: el bodeguero o la</text><text x="410" y="792" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">app en el teléfono.</text><rect x="760" y="670" width="725" height="190" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1.2"/><path d="M794,696 h-10 v38 h10" fill="none" stroke="#c00000" stroke-width="1.5"/><text x="790" y="712" font-size="11.5" fill="#c00000" font-weight="bold" text-anchor="start">Se pierden 5 de 14</text><text x="790" y="726" font-size="11.5" fill="#c00000" font-weight="bold" text-anchor="start">facturas</text><path d="M794,766 h-10 v38 h10" fill="none" stroke="#1e7b4f" stroke-width="1.5"/><text x="790" y="782" font-size="11.5" fill="#1e7b4f" font-weight="bold" text-anchor="start">Ninguna factura sin</text><text x="790" y="796" font-size="11.5" fill="#1e7b4f" font-weight="bold" text-anchor="start">registrar</text><text x="1140" y="710" font-size="14.5" fill="#1f4e79" font-weight="bold" text-anchor="start">Anotación y asociación</text><text x="1140" y="732" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">Comentario sobre un elemento. En rojo, los</text><text x="1140" y="747" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">puntos de error del proceso actual; en</text><text x="1140" y="762" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">verde, la mejora que introduce el proceso</text><text x="1140" y="777" font-size="12" fill="#404040" font-weight="normal" text-anchor="start">propuesto.</text></svg>