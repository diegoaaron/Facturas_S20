763.6" font-size="12" fill="#262626" font-weight="normal" text-anchor="start">actor VARCHAR2(60)</text><text x="40" y="782.2" font-size="12" fill="#262626" font-weight="normal" text-anchor="start">accion VARCHAR2(40)</text><text x="40" y="800.8" font-size="12" fill="#262626" font-weight="normal" text-anchor="start">entidad VARCHAR2(40)</text><text x="40" y="819.4" font-size="12" fill="#262626" font-weight="normal" text-anchor="start">fecha TIMESTAMP</text><text x="40" y="838.0" font-size="12" fill="#262626" font-weight="normal" text-anchor="start">ip_hash CHAR(64)</text><path d="M390,120 L500,120" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="396" y1="113" x2="396" y2="127" stroke="#404040" stroke-width="1.6"/><line x1="401" y1="113" x2="401" y2="127" stroke="#404040" stroke-width="1.6"/><line x1="486" y1="120" x2="500" y2="112" stroke="#404040" stroke-width="1.5"/><line x1="486" y1="120" x2="500" y2="120" stroke="#404040" stroke-width="1.5"/><line x1="486" y1="120" x2="500" y2="128" stroke="#404040" stroke-width="1.5"/><circle cx="479" cy="120" r="4.5" fill="#fff" stroke="#404040" stroke-width="1.4"/><text x="445" y="112" font-size="11" fill="#7f7f7f" font-weight="normal" font-style="italic" text-anchor="middle">registra</text><path d="M880,120 L990,120" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="886" y1="113" x2="886" y2="127" stroke="#404040" stroke-width="1.6"/><line x1="891" y1="113" x2="891" y2="127" stroke="#404040" stroke-width="1.6"/><line x1="976" y1="120" x2="990" y2="112" stroke="#404040" stroke-width="1.5"/><line x1="976" y1="120" x2="990" y2="120" stroke="#404040" stroke-width="1.5"/><line x1="976" y1="120" x2="990" y2="128" stroke="#404040" stroke-width="1.5"/><circle cx="969" cy="120" r="4.5" fill="#fff" stroke="#404040" stroke-width="1.4"/><text x="935" y="112" font-size="11" fill="#7f7f7f" font-weight="normal" font-style="italic" text-anchor="middle">sube</text><path d="M210,80 L210,62 L1180,62 L1180,80" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="203" y1="74" x2="217" y2="74" stroke="#404040" stroke-width="1.6"/><line x1="203" y1="69" x2="217" y2="69" stroke="#404040" stroke-width="1.6"/><line x1="1180" y1="66" x2="1188" y2="80" stroke="#404040" stroke-width="1.5"/><line x1="1180" y1="66" x2="1180" y2="80" stroke="#404040" stroke-width="1.5"/><line x1="1180" y1="66" x2="1172" y2="80" stroke="#404040" stroke-width="1.5"/><circle cx="1180" cy="59" r="4.5" fill="#fff" stroke="#404040" stroke-width="1.4"/><text x="700" y="56" font-size="11" fill="#7f7f7f" font-weight="normal" font-style="italic" text-anchor="middle">posee</text><path d="M390,480 L500,480" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="396" y1="473" x2="396" y2="487" stroke="#404040" stroke-width="1.6"/><line x1="401" y1="473" x2="401" y2="487" stroke="#404040" stroke-width="1.6"/><line x1="486" y1="480" x2="500" y2="472" stroke="#404040" stroke-width="1.5"/><line x1="486" y1="480" x2="500" y2="480" stroke="#404040" stroke-width="1.5"/><line x1="486" y1="480" x2="500" y2="488" stroke="#404040" stroke-width="1.5"/><circle cx="479" cy="480" r="4.5" fill="#fff" stroke="#404040" stroke-width="1.4"/><text x="445" y="472" font-size="11" fill="#7f7f7f" font-weight="normal" font-style="italic" text-anchor="middle">publica</text><path d="M210,440 L210,420 L1180,420 L1180,440" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="203" y1="434" x2="217" y2="434" stroke="#404040" stroke-width="1.6"/><line x1="203" y1="429" x2="217" y2="429" stroke="#404040" stroke-width="1.6"/><line x1="1180" y1="426" x2="1188" y2="440" stroke="#404040" stroke-width="1.5"/><line x1="1180" y1="426" x2="1180" y2="440" stroke="#404040" stroke-width="1.5"/><line x1="1180" y1="426" x2="1172" y2="440" stroke="#404040" stroke-width="1.5"/><circle cx="1180" cy="419" r="4.5" fill="#fff" stroke="#404040" stroke-width="1.4"/><text x="940" y="414" font-size="11" fill="#7f7f7f" font-weight="normal" font-style="italic" text-anchor="middle">publica</text><path d="M1370,500 L1410,500 L1410,160 L1450,160" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="1376" y1="493" x2="1376" y2="507" stroke="#404040" stroke-width="1.6"/><line x1="1381" y1="493" x2="1381" y2="507" stroke="#404040" stroke-width="1.6"/><line x1="1436" y1="160" x2="1450" y2="152" stroke="#404040" stroke-width="1.5"/><line x1="1436" y1="160" x2="1450" y2="160" stroke="#404040" stroke-width="1.5"/><line x1="1436" y1="160" x2="1450" y2="168" stroke="#404040" stroke-width="1.5"/><line x1="1432" y1="167" x2="1432" y2="153" stroke="#404040" stroke-width="1.6"/><text x="1440" y="152" font-size="11" fill="#7f7f7f" font-weight="normal" font-style="italic" text-anchor="middle">define</text><path d="M1370,540 L1420,540 L1420,360 L1450,360" fill="none" stroke="#404040" stroke-width="1.5"/><line x1="1376" y1="533" x2="1376" y2="547" stroke="#404040" stroke-width="1.6"/><line x1="1381" y1="533" x2="1381" y2="547" stroke="#404040" stroke-width="1.6"/><line x1="1436" y1="360" x2="1450" y2="352" stroke="#404040" stroke-width="1.5"/><line x1="1436" y1="360" x2="1450" y2="360" stroke="#404040" stroke-width="1.5"/><line x1="1436" y1="360" x2="1450" y2="368" stroke="#404040" stroke-width="1.5"/><line x1="1432" y1="367" x2="1432" y2="353" stroke="#404040" stroke-width="1.6"/><rect x="500" y="700" width="1240" height="180" rx="10" fill="#e3f1e8" stroke="#1e7b4f" stroke-width="1.2"/><text x="520" y="728" font-size="14" fill="#1e7b4f" font-weight="bold" text-anchor="start">Consideraciones de seguridad del esquema</text><text x="520" y="756" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start">• El respaldo llega cifrado desde el teléfono (AES-256-GCM con clave derivada de una frase de respaldo del usuario): el servidor guarda un BLOB que no puede leer.</text><text x="520" y="780" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start">• Las contraseñas se guardan con BCrypt (hash_clave); ninguna tabla guarda claves en texto plano ni imágenes de facturas.</text><text x="520" y="804" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start">• Usuario de aplicación con privilegios mínimos (SELECT/INSERT/UPDATE); el DDL lo ejecuta solo Flyway con otro usuario.</text><text x="520" y="828" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start">• auditoria registra accesos y publicaciones sin datos personales (IP con hash). TDE/Always Encrypted en reposo; TLS en tránsito.</text><text x="520" y="852" font-size="12" fill="#1a1a1a" font-weight="normal" text-anchor="start">• sha256 permite verificar la integridad de cada respaldo y de cada versión del modelo antes de usarla.</text></svg>