# Catálogo de versiones del proyecto. Todas las dependencias se declaran aquí y
# los build.gradle.kts las usan con libs.<alias>. Al actualizar una versión,
# sincroniza y compila antes de hacer commit.

[versions]
# AGP: no subir de 9.1.x — es lo máximo que soporta el plugin Android de IntelliJ 2026.2
# (con 9.4.1 IntelliJ dice "incompatible version... Latest supported version is AGP 9.1.0").
agp = "9.1.1"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
fragment = "1.9.1"
navigation = "2.10.2"
lifecycle = "2.11.0"
# biometric: 1.1.0 es la última estable (las 1.2 y 1.4 siguen en alfa).
biometric = "1.1.0"
splashscreen = "1.2.0"
junit4 = "4.13.2"
junitJupiter = "6.1.3"
androidxJunit = "1.3.0"
espresso = "3.7.0"
androidxTest = "1.7.0"
room = "2.8.5"
sqlite = "2.7.1"
# SQLCipher: no subir de 4.17.x mientras compileSdk sea 36 (desde 4.18.0 exige compileSdk 37).
sqlcipher = "4.17.0"

[libraries]
# UI
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

# Acceso con huella (P02, BiometricPrompt)
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Base de datos: Room sobre SQLite cifrada con SQLCipher (documentación técnica §7)
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# Pruebas
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitJupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
